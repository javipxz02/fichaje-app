<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Clock circle -->
  <circle cx="256" cy="240" r="130" fill="none" stroke="white" stroke-width="14" opacity="0.95"/>
  <!-- Hour hand -->
  <line x1="256" y1="240" x2="256" y2="160" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="240" x2="310" y2="270" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="240" r="8" fill="white"/>
  <!-- Checkmark -->
  <polyline points="210,400 240,430 300,370" fill="none" stroke="#34C759" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

